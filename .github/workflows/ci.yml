name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches:
      - main

# Only duplicate full validations of the same PR merge commit replace each other.
# Waiting events and main commits stay isolated even when events arrive out of order.
concurrency:
  group: >-
    ${{ format('{0}-{1}', github.workflow,
      github.event_name == 'pull_request' &&
      ((contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) &&
          !(github.event.repository.private == true && vars.CI_MANUAL_PR == 'true')) ||
        (github.event.repository.private == true && vars.CI_MANUAL_PR == 'true' &&
          github.event.action == 'labeled' && github.event.label.name == 'run-ci'))
      && format('pr-{0}-{1}', github.event.number, github.sha) || format('run-{0}', github.run_id)) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
      ((contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) &&
          !(github.event.repository.private == true && vars.CI_MANUAL_PR == 'true')) ||
        (github.event.repository.private == true && vars.CI_MANUAL_PR == 'true' &&
          github.event.action == 'labeled' && github.event.label.name == 'run-ci')) }}

jobs:
  checks:
    # Private repositories may opt into one validation per fresh label request.
    # Existing labels never authorize a new commit; public CI stays automatic.
    if: &run-full-validation >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) &&
          !(github.event.repository.private == true && vars.CI_MANUAL_PR == 'true')) ||
        (github.event_name == 'pull_request' && github.event.repository.private == true &&
          vars.CI_MANUAL_PR == 'true' && github.event.action == 'labeled' &&
          github.event.label.name == 'run-ci') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci

      # Fail if local validate gains a gate that this workflow does not run.
      - name: Verify validation coverage
        id: coverage
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const { scripts } = JSON.parse(readFileSync('package.json', 'utf8'));
          const commands = scripts.validate.split(' && ');
          const finalCheck = commands.pop();
          assert.deepEqual(commands, [
            'npm run check:plugin-build', 'npm run typecheck:all', 'npm test -- --run',
            'npm run build', 'npm run check:plugins', 'npm run smoke:runtime-package',
            'npm run check:runtime-package', 'npm run smoke:packed-runtime-package',
            'npm run check:publication',
          ], 'CI must cover every local validate gate');
          const isPublicValidation = finalCheck === 'npm run check:public-snapshot';
          if (!isPublicValidation) assert.equal(finalCheck, 'git diff --check');
          appendFileSync(process.env.GITHUB_OUTPUT, `public_snapshot=${isPublicValidation}\n`);
          NODE

      - name: Check plugin build
        run: npm run check:plugin-build
      - name: Typecheck
        run: npm run typecheck:all
      - name: Build
        run: npm run build
      - name: Check plugins
        run: npm run check:plugins
      - name: Smoke runtime package
        run: npm run smoke:runtime-package
      - name: Check runtime package contents and budget
        run: npm run check:runtime-package
      - name: Smoke packed consumer
        run: npm run smoke:packed-runtime-package
      - name: Check publication readiness
        run: npm run check:publication
      - name: Check public snapshot
        if: steps.coverage.outputs.public_snapshot == 'true'
        run: npm run check:public-snapshot
      - name: Check diff whitespace
        if: steps.coverage.outputs.public_snapshot == 'false'
        run: git diff --check

  tests:
    if: *run-full-validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: 2
      REPORT_DIR: .codex/artifacts/ci-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Record test inventory and environment
        run: |
          mkdir -p "$REPORT_DIR"
          # filesOnly does not apply sharding in Vitest 4; record the full inventory.
          npx vitest list --filesOnly --json="$REPORT_DIR/inventory.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const vitest = JSON.parse(readFileSync('node_modules/vitest/package.json', 'utf8')).version;
          writeFileSync(`${process.env.REPORT_DIR}/metadata.json`, JSON.stringify({
            sha: process.env.GITHUB_SHA, root: process.cwd(),
            shard: Number(process.env.SHARD), shards: Number(process.env.SHARD_COUNT),
            node: process.version, vitest, platform: process.platform, arch: process.arch,
            runner: process.env.RUNNER_OS, image: process.env.ImageOS,
          }, null, 2));
          NODE
      - name: Run test shard
        run: >-
          npm test -- --run --shard="$SHARD/$SHARD_COUNT"
          --reporter=default --reporter=json
          --outputFile.json="$REPORT_DIR/results.json"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: .codex/artifacts/ci-validation/*.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # Run the gate so GitHub evaluates its name even when all heavy jobs are skipped.
  # The short waiting job never publishes the required validate check.
  validate:
    name: >-
      ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) &&
          !(github.event.repository.private == true && vars.CI_MANUAL_PR == 'true')) ||
        (github.event_name == 'pull_request' && github.event.repository.private == true &&
          vars.CI_MANUAL_PR == 'true' && github.event.action == 'labeled' &&
          github.event.label.name == 'run-ci')) && 'validate' ||
        (github.event.repository.private == true && vars.CI_MANUAL_PR == 'true' &&
          'ci-awaiting-request' || 'ci-not-requested') }}
    if: always()
    needs: [checks, tests, macos-companion, windows-compatibility]
    runs-on: ubuntu-latest
    env:
      RUN_FULL_VALIDATION: *run-full-validation
    steps:
      - name: Explain unrequested validation
        if: env.RUN_FULL_VALIDATION != 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          ## Full validation was not requested by this event
          In private manual mode, add the `run-ci` label when ready. If it is already present, remove and re-add it.
          A later commit needs a fresh request. Cancel obsolete runs manually when they are no longer needed.
          Automatic repositories validate when a PR is opened, reopened, or updated; label changes do not request full validation.
          MARKDOWN
      - name: Setup Node
        if: env.RUN_FULL_VALIDATION == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require every validation job
        if: env.RUN_FULL_VALIDATION == 'true'
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const needs = JSON.parse(process.env.VALIDATION_NEEDS);
          assert.deepEqual(Object.keys(needs).sort(), ['checks', 'macos-companion', 'tests', 'windows-compatibility']);
          for (const [name, job] of Object.entries(needs)) {
            assert.equal(job.result, 'success', `Required job ${name}: ${job.result}`);
          }
          NODE
      - name: Download test evidence
        if: env.RUN_FULL_VALIDATION == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-shard-*
          path: .codex/artifacts/ci-validation
      - name: Verify complete test inventory
        if: env.RUN_FULL_VALIDATION == 'true'
        env:
          REPORT_DIR: .codex/artifacts/ci-validation
          SHARD_COUNT: 2
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync, appendFileSync } from 'node:fs';
          import { relative, isAbsolute } from 'node:path';
          const readJson = path => JSON.parse(readFileSync(path, 'utf8'));
          const count = Number(process.env.SHARD_COUNT);
          const names = Array.from({ length: count }, (_, i) => `vitest-shard-${i + 1}`);
          assert.deepEqual(readdirSync(process.env.REPORT_DIR).sort(), names);
          const executed = new Set();
          const rows = [];
          let expectedFiles;
          let expectedEnvironment;
          let totalTests = 0;
          function relativeTestPath(root, file) {
            const path = relative(root, file);
            assert.ok(path, 'Empty test path');
            assert.ok(!isAbsolute(path), 'Test path must be relative to checkout');
            assert.notEqual(path.split('/')[0], '..', 'Test path outside checkout');
            return path;
          }
          for (const [index, name] of names.entries()) {
            const dir = `${process.env.REPORT_DIR}/${name}`;
            const metadata = readJson(`${dir}/metadata.json`);
            assert.equal(metadata.sha, process.env.GITHUB_SHA, 'Stale test evidence');
            assert.equal(metadata.shard, index + 1);
            assert.equal(metadata.shards, count);
            assert.match(metadata.node, /^v24\./);
            assert.equal(metadata.platform, 'linux');
            const environment = [metadata.node, metadata.vitest, metadata.platform, metadata.arch];
            expectedEnvironment ??= environment;
            assert.deepEqual(environment, expectedEnvironment, 'Shard environments differ');
            const inventory = readJson(`${dir}/inventory.json`);
            const files = inventory.map(entry => relativeTestPath(metadata.root, entry.file)).sort();
            assert.ok(files.length > 0, 'Empty test inventory');
            assert.equal(new Set(files).size, files.length, 'Duplicate inventory entries');
            expectedFiles ??= files;
            assert.deepEqual(files, expectedFiles, 'Shard discovery differs');
            const report = readJson(`${dir}/results.json`);
            assert.equal(report.success, true, 'Unsuccessful test report');
            assert.equal(report.numFailedTests, 0);
            assert.equal(report.numFailedTestSuites, 0);
            assert.ok(report.testResults.length > 0, 'Empty shard report');
            for (const suite of report.testResults) {
              const file = relativeTestPath(metadata.root, suite.name);
              assert.ok(!executed.has(file), `Test file ran more than once: ${file}`);
              executed.add(file);
              for (const test of suite.assertionResults) {
                const isCompletedTest = ['passed', 'skipped', 'todo'].includes(test.status);
                assert.ok(isCompletedTest, `Incomplete test: ${file}: ${test.fullName} (${test.status})`);
                totalTests++;
              }
            }
            const duration = Math.max(...report.testResults.map(suite => suite.endTime)) - report.startTime;
            rows.push(`| ${index + 1}/${count} | ${report.testResults.length} | ${report.numPassedTests} | ${report.numPendingTests + report.numTodoTests} | ${(duration / 1000).toFixed(1)} s |`);
          }
          assert.deepEqual([...executed].sort(), expectedFiles, 'Missing or unexpected test files');
          const summary = [
            '## Validation evidence', '',
            `Verified ${executed.size} test files and ${totalTests} test cases across ${count} shards.`, '',
            '| Shard | Files | Passed | Skipped / todo | Reported test span |',
            '| --- | ---: | ---: | ---: | ---: |', ...rows, '',
            'All required jobs passed. Job and step timings are available in the workflow run.',
            'Reported spans exclude final teardown; use job timings for workflow latency and runner time.',
          ].join('\n');
          console.log(summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          NODE

  windows-compatibility:
    if: *run-full-validation
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # Generated-file checks compare LF bytes on every platform.
      - name: Preserve checkout line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Check plugin build
        run: npm run check:plugin-build
      - name: Typecheck
        run: npm run typecheck:all
      - name: Build
        run: npm run build
      - name: Check plugins
        run: npm run check:plugins
      - name: Prepare test evidence
        run: New-Item -ItemType Directory -Force .codex/artifacts/ci-windows-compatibility | Out-Null
      - name: Validate plugin compatibility and loading
        run: >-
          npx vitest run
          src/runtime/__tests__/plugin-platform-compatibility.test.ts
          src/runtime/__tests__/plugin-platform-loading.test.ts
          src/runtime/__tests__/plugin-platform-catalog.test.ts
          src/runtime/__tests__/plugin-platform-ui.test.ts
          src/runtime/__tests__/plugin-platform-installation.test.ts
          src/runtime/__tests__/plugin-install-source.test.ts
          src/runtime/__tests__/plugin-install-archive.test.ts
          src/runtime/__tests__/plugin-output-channels-contract.test.ts
          src/web-ui/client-state
          --reporter=default --reporter=json
          --outputFile.json=.codex/artifacts/ci-windows-compatibility/results.json
      # Bound simultaneous PowerShell startup on shared Windows runners.
      - name: Validate native collection and acknowledgment
        run: >-
          npx vitest run
          src/runtime/__tests__/windows-private-access.test.ts
          src/runtime/__tests__/collection-consent.test.ts
          src/runtime/__tests__/collection-consent-service-lifecycle.test.ts
          src/runtime/__tests__/system-host-collection-consent.test.ts
          src/runtime/__tests__/native-observation-connection.test.ts
          src/runtime/__tests__/native-observation-shutdown.test.ts
          src/runtime/__tests__/native-observation-ownership.test.ts
          src/runtime/__tests__/runtime-observation-connection.test.ts
          src/runtime/__tests__/web-ui-collection-consent-dialog.test.ts
          src/runtime/__tests__/web-ui-collection-consent-feature.test.ts
          src/runtime/__tests__/web-ui-collection-consent-gate.test.ts
          src/runtime/__tests__/web-ui-native-windows-access.test.ts
          src/runtime/__tests__/web-ui-runtime-setup-native-windows.test.ts
          src/runtime/__tests__/web-ui-system-host-transport.test.ts
          --maxWorkers=2 --reporter=default --reporter=json
          --outputFile.json=.codex/artifacts/ci-windows-compatibility/native-collection-results.json
      - name: Validate native Windows public plugins
        run: >-
          npx vitest run
          src/runtime/__tests__/windows-public-plugin-cohort.test.ts
          src/runtime/__tests__/local-search-platform.test.ts
          src/runtime/__tests__/windows-local-search-authority.test.ts
          src/runtime/__tests__/windows-local-search-transport.test.ts
          src/runtime/__tests__/code-outline-platform.test.ts
          src/runtime/__tests__/code-outline-read-failures.test.ts
          src/runtime/__tests__/document-reader-platform.test.ts
          src/runtime/__tests__/document-reader-read-failures.test.ts
          src/runtime/__tests__/document-reader-pdf-process.test.ts
          src/runtime/__tests__/json-inspector-platform.test.ts
          src/runtime/__tests__/json-inspector-read-failures.test.ts
          src/runtime/__tests__/json-inspector-plugin.test.ts
          src/runtime/__tests__/project-orientation-platform.test.ts
          src/runtime/__tests__/project-orientation-read-failures.test.ts
          src/runtime/__tests__/windows-sdk-file-reading.test.ts
          src/runtime/__tests__/windows-sdk-file-transport.test.ts
          src/runtime/__tests__/windows-filesystem-availability.test.ts
          src/runtime/__tests__/windows-filesystem-creation-permissions.test.ts
          src/runtime/__tests__/windows-filesystem-mutation-coordinator.test.ts
          src/runtime/__tests__/windows-filesystem-named-streams.test.ts
          src/runtime/__tests__/windows-filesystem-native.test.ts
          src/runtime/__tests__/windows-filesystem-permissions.test.ts
          src/runtime/__tests__/windows-filesystem-precommit-access.test.ts
          src/runtime/__tests__/windows-filesystem-process.test.ts
          src/runtime/__tests__/windows-filesystem-publication.test.ts
          src/runtime/__tests__/windows-filesystem-storage-attributes.test.ts
          src/runtime/__tests__/windows-portable-plugins-catalog.test.ts
          src/runtime/__tests__/windows-portable-plugins-memory.test.ts
          src/runtime/__tests__/memory-prepared-replacement.test.ts
          src/runtime/__tests__/windows-memory-publication.test.ts
          src/runtime/__tests__/memory-lock-owner-observation.test.ts
          src/runtime/__tests__/windows-memory-owner-observation.test.ts
          src/runtime/__tests__/windows-portable-plugins-lock-owner.test.ts
          src/runtime/__tests__/windows-portable-plugins-lock-observation.test.ts
          src/runtime/__tests__/windows-portable-plugins-lock-claim.test.ts
          src/runtime/__tests__/windows-portable-plugins-web.test.ts
          src/runtime/__tests__/windows-system-probe-metrics.test.ts
          src/runtime/__tests__/windows-system-probe-native.test.ts
          src/runtime/__tests__/exec-shell-platform.test.ts
          src/runtime/__tests__/windows-exec-native.test.ts
          src/runtime/__tests__/windows-exec-bootstrap.test.ts
          src/runtime/__tests__/windows-exec-observer.test.ts
          src/runtime/__tests__/exec-output-store.test.ts
          src/runtime/__tests__/windows-exec-process-lifecycle.test.ts
          src/runtime/__tests__/windows-system-plugin-platform.test.ts
          src/runtime/__tests__/windows-system-plugin-commands.test.ts
          src/runtime/__tests__/system-command-working-directory.test.ts
          src/runtime/__tests__/windows-system-filesystem-handoff.test.ts
          src/runtime/__tests__/windows-system-plugin-privacy.test.ts
          src/runtime/__tests__/windows-system-plugin-initialization.test.ts
          --maxWorkers=4 --reporter=default --reporter=json
          --outputFile.json=.codex/artifacts/ci-windows-compatibility/public-plugins-results.json
      - name: Validate native Windows private plugins
        if: github.event.repository.private == true
        run: >-
          npx vitest run
          tests/private/plugins/
          tests/private/publication/distribution-boundary.test.ts
          --maxWorkers=4 --reporter=default --reporter=json
          --outputFile.json=.codex/artifacts/ci-windows-compatibility/private-plugins-results.json
      - name: Validate session publication and resumed steering
        run: >-
          npx vitest run
          src/sessions/prepared-session-replacement.test.ts
          src/sessions/windows-session-publication.test.ts
          src/runtime/__tests__/request-activation-commit-ordering.test.ts
          src/runtime/__tests__/web-steering-owner-routing.test.ts
          src/runtime/__tests__/web-request-control-diagnostics.test.ts
          src/runtime/__tests__/web-saved-approval-steering.test.ts
          --maxWorkers=4 --reporter=default --reporter=json
          --outputFile.json=.codex/artifacts/ci-windows-compatibility/session-steering-results.json
      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-compatibility-results
          path: .codex/artifacts/ci-windows-compatibility/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  macos-companion:
    if: *run-full-validation
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate native Mac connection
        run: >-
          npx vitest run
          src/runtime/__tests__/host-companion-broker-platform.test.ts
          src/runtime/__tests__/host-companion-broker-lifecycle.test.ts
          src/runtime/__tests__/host-passive-observation-transport.test.ts
          src/runtime/__tests__/host-companion-native-process-owner.test.ts
          src/runtime/__tests__/web-system-host-startup-retry.test.ts
          src/runtime/__tests__/web-system-host-owner-revocation.test.ts
          src/runtime/__tests__/web-system-host-macos-setup.test.ts
          src/runtime/__tests__/web-ui-system-host-startup-diagnostic.test.ts
          src/runtime/__tests__/host-companion-local-installation.test.ts
          src/runtime/__tests__/system-host-local-setup.test.ts
          src/runtime/__tests__/web-system-host-local-connection.test.ts
          src/runtime/__tests__/host-companion-native-runtime.test.ts
          src/runtime/__tests__/host-companion-native-loopback.test.ts
          src/runtime/__tests__/host-companion-native-loopback-tls.test.ts
          src/runtime/__tests__/host-companion-managed-startup.test.ts
          src/runtime/__tests__/host-companion-setup.test.ts
          src/runtime/__tests__/host-companion-install-links.test.ts
          src/runtime/__tests__/host-companion-install-link-macos.test.ts
          src/runtime/__tests__/host-macos-observation-permission.test.ts
          src/runtime/__tests__/host-macos-capture-geometry.test.ts
          src/runtime/__tests__/host-macos-keyboard-contract.test.ts
          src/runtime/__tests__/local-host/native-permission-process.test.ts
          src/runtime/__tests__/macos-permission-preflight-native.test.ts
          src/runtime/__tests__/host-notifications-macos-bundle-native.test.ts
          src/runtime/__tests__/host-observation-process-lifecycle.test.ts
